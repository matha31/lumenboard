<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Lumenboard — Weekly Risk Digest</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=IBM+Plex+Mono:wght@300;400;500&display=swap"
  rel="stylesheet"
/>
<style>
  /* Palette and type follow the client deck's "Signal" system so the artifact
     and the presentation read as one piece of work: deep navy ground, warm
     cream text, a single antique-gold accent, editorial serif for headings and
     a condensed mono for chrome. Deliberately dark-only — the deck commits to
     navy, and a light variant would break the family resemblance on a
     projector. Structure, classes and behaviour below are untouched; this is a
     restyle, not a rewrite. */
  :root {
    color-scheme: dark;
    --bg: #1c2644;
    --bg-alt: #232f55;
    --panel: #202b4c;
    --border: #2e3d5c;
    --border-soft: #273354;
    --text: #e2dcd0;
    --muted: #8a96a8;
    --faint: #4e5a6e;
    --accent: #c8a870;

    /* Bucket semantics, retuned to sit on navy without going neon. Watch
       borrows the gold outright — caution is exactly what that colour means
       here — so urgent and healthy are pitched to stay distinct from it. */
    --urgent: #e07a6f;
    --urgent-bg: rgba(224, 122, 111, 0.13);
    --watch: #c8a870;
    --watch-bg: rgba(200, 168, 112, 0.13);
    --healthy: #8bb598;
    --healthy-bg: rgba(139, 181, 152, 0.13);
    --sparkline: #8a96a8;

    --f-display: "Source Serif 4", Georgia, serif;
    --f-body: "DM Sans", system-ui, sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--f-body);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  /* The deck's 80px grid texture, same values, as a fixed backdrop. */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 80px 80px;
    pointer-events: none;
    z-index: 0;
  }
  body > * { position: relative; z-index: 1; }

  /* Header and toolbar stay full-bleed (their border and fill should span the
     window) but their *contents* line up with the centred card column, so the
     title, the controls and the account rows all share one left edge. */
  header, .toolbar, .error-banner {
    padding-inline: max(24px, calc((100% - 1000px) / 2));
  }
  header {
    padding-top: 26px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    margin: 0 0 6px;
    font-family: var(--f-display);
    font-size: 1.65rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  /* Gold rule under the title — the deck's cover and chapter motif. */
  header h1::after {
    content: "";
    display: block;
    width: 34px;
    height: 2px;
    background: var(--accent);
    margin-top: 12px;
  }
  header p { margin: 0; color: var(--muted); font-size: 0.85rem; max-width: 62ch; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    padding-top: 14px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-alt);
  }
  .toolbar label {
    font-family: var(--f-mono);
    font-size: 0.66rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .toolbar input, .toolbar select {
    font-family: var(--f-body);
    font-size: 0.85rem;
    letter-spacing: 0;
    text-transform: none;
    padding: 6px 9px;
    border-radius: 2px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
  }
  .toolbar input:focus, .toolbar select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .toolbar button {
    font-family: var(--f-mono);
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 8px 16px;
    border-radius: 2px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    cursor: pointer;
    transition: background 0.18s ease, color 0.18s ease;
  }
  .toolbar button:hover { background: var(--accent); color: var(--bg); }
  .toolbar button.secondary { border-color: var(--border); color: var(--muted); }
  .toolbar button.secondary:hover { background: var(--border); color: var(--text); }
  .status-line {
    font-family: var(--f-mono);
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    color: var(--faint);
    margin-left: auto;
  }

  /* Same column arithmetic as header/.toolbar above, so all three align
     exactly. (max-width + auto margins would sit 24px inboard of them.) */
  main {
    padding-top: 26px;
    padding-bottom: 60px;
    padding-inline: max(24px, calc((100% - 1000px) / 2));
  }
  .bucket { margin-bottom: 34px; }
  .bucket-header {
    display: flex; align-items: center; gap: 10px; margin-bottom: 14px; cursor: pointer;
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
  .bucket-header h2 {
    font-family: var(--f-display);
    font-size: 1.25rem;
    font-weight: 600;
    margin: 0;
  }
  .count-badge {
    font-family: var(--f-mono);
    font-size: 0.68rem;
    font-weight: 500;
    border-radius: 2px;
    padding: 3px 9px;
    letter-spacing: 0.06em;
  }
  .bucket-urgent .count-badge { background: var(--urgent-bg); color: var(--urgent); }
  .bucket-watch .count-badge { background: var(--watch-bg); color: var(--watch); }
  .bucket-healthy .count-badge { background: var(--healthy-bg); color: var(--healthy); }

  .card {
    background: var(--panel);
    border: 1px solid var(--border-soft);
    border-left-width: 3px;
    border-radius: 2px;
    padding: 13px 16px;
    margin-bottom: 8px;
    transition: border-color 0.18s ease, background 0.18s ease;
  }
  .card:hover { background: var(--bg-alt); border-color: var(--border); }
  .bucket-urgent .card { border-left-color: var(--urgent); }
  .bucket-watch .card { border-left-color: var(--watch); }
  .bucket-healthy .card { border-left-color: var(--healthy); }

  .card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; cursor: pointer; }
  .card-top .name {
    font-family: var(--f-display);
    font-size: 1.05rem;
    font-weight: 600;
  }
  /* Plan tag: the mono chrome treatment, so it reads as metadata not name. */
  .card-top .name .card-meta {
    font-family: var(--f-mono);
    font-size: 0.62rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .card-meta {
    font-family: var(--f-mono);
    color: var(--muted);
    font-size: 0.7rem;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .card-reason { margin-top: 6px; font-size: 0.85rem; color: var(--muted); }
  .card-detail { margin-top: 12px; border-top: 1px solid var(--border-soft); padding-top: 12px; display: none; }
  .card.expanded .card-detail { display: block; }

  .spark-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .spark-row svg { flex-shrink: 0; }
  .spark-label {
    font-family: var(--f-mono);
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--faint);
  }

  .event-mix { display: flex; flex-wrap: wrap; gap: 6px; }
  .event-badge {
    font-family: var(--f-mono);
    font-size: 0.66rem; padding: 3px 8px; border-radius: 2px; border: 1px solid var(--border);
    color: var(--muted);
  }
  .event-badge.positive { color: var(--healthy); border-color: var(--healthy); }

  .empty-state { color: var(--muted); font-size: 0.85rem; padding: 8px 0; }
  .error-banner {
    background: var(--urgent-bg); color: var(--urgent); padding: 12px 15px; border-radius: 2px;
    border: 1px solid var(--urgent);
    margin: 14px 24px; font-size: 0.85rem;
  }
  .flag {
    font-family: var(--f-mono);
    font-size: 0.62rem; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--watch); border: 1px solid var(--watch); border-radius: 2px;
    padding: 2px 6px; margin-left: 8px; white-space: nowrap;
  }
</style>
</head>
<body>

<header>
  <h1>Lumenboard — Weekly Risk Digest</h1>
  <p>Accounts ranked by churn exposure — health, usage trend, and renewal proximity, cross-referenced.</p>
</header>

<div class="toolbar">
  <label>API base
    <input id="cfg-base" type="text" size="18" placeholder="/api" />
  </label>
  <label>Plan
    <select id="filter-plan">
      <option value="">All plans</option>
      <option value="starter">Starter</option>
      <option value="pro">Pro</option>
      <option value="enterprise">Enterprise</option>
    </select>
  </label>
  <label>Renewal within
    <select id="filter-window">
      <option value="">Any time</option>
      <option value="30">30 days</option>
      <option value="60">60 days</option>
      <option value="90">90 days</option>
    </select>
  </label>
  <label>Sort by
    <select id="sort-by">
      <option value="risk">Risk (high → low)</option>
      <option value="mrr">MRR (high → low)</option>
      <option value="renewal">Renewal (soonest)</option>
      <option value="name">Name (A → Z)</option>
    </select>
  </label>
  <button id="btn-reload">Reload</button>
  <span class="status-line" id="status-line">not loaded yet</span>
</div>

<div id="error-slot"></div>
<main id="main">
  <div class="empty-state">Loading accounts…</div>
</main>

<script type="module">
import { listAtRiskAccounts } from '../../backend/mcp-server/src/tools/list_at_risk_accounts.mjs';
import { listRecentEvents } from '../../backend/mcp-server/src/tools/list_recent_events.mjs';
import { getAccountUsage } from '../../backend/mcp-server/src/tools/get_account_usage.mjs';
import { checkHealth } from '../../backend/mcp-server/src/lumenboardClient.mjs';

const STORAGE_KEY = 'lumenboard.artifact.settings.v1';
const POSITIVE_EVENT_TYPES = new Set(['seat_added', 'invite_sent', 'integration_connected']);

const baseInput = document.getElementById('cfg-base');
const planFilter = document.getElementById('filter-plan');
const windowFilter = document.getElementById('filter-window');
const sortBy = document.getElementById('sort-by');
const reloadBtn = document.getElementById('btn-reload');
const statusLine = document.getElementById('status-line');
const errorSlot = document.getElementById('error-slot');
const mainEl = document.getElementById('main');

function loadSettings() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch (_) { saved = {}; }
  baseInput.value = saved.base || '/api';
  planFilter.value = saved.plan || '';
  windowFilter.value = saved.window || '';
  sortBy.value = saved.sort || 'risk';
}

function saveSettings() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    base: baseInput.value,
    plan: planFilter.value,
    window: windowFilter.value,
    sort: sortBy.value,
  }));
}

// No apiKey here on purpose: the artifact talks to its same-origin backend
// (`/api`, the dev-proxy / MCP server), which injects the team key server-side.
// The credential never enters client code or the model's context (proposal §03).
function clientOpts() {
  return { baseUrl: baseInput.value || '/api' };
}

function sparklineSvg(series) {
  if (!series || series.length === 0) {
    return '<span class="spark-label">no usage history</span>';
  }
  const w = 120, h = 28, pad = 2;
  const values = series.map((p) => p.active_users);
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;
  const stepX = (w - pad * 2) / Math.max(1, values.length - 1);
  const points = values.map((v, i) => {
    const x = pad + i * stepX;
    const y = h - pad - ((v - min) / range) * (h - pad * 2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <polyline fill="none" stroke="var(--sparkline)" stroke-width="1.6" points="${points}" />
  </svg>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function passesFilters(account) {
  if (planFilter.value && account.plan !== planFilter.value) return false;
  if (windowFilter.value) {
    const windowDays = Number(windowFilter.value);
    if (!(account.days_to_renewal >= 0 && account.days_to_renewal <= windowDays)) return false;
  }
  return true;
}

function sortAccounts(list) {
  const sorted = list.slice();
  switch (sortBy.value) {
    case 'mrr': sorted.sort((a, b) => b.mrr - a.mrr); break;
    case 'renewal': sorted.sort((a, b) => a.days_to_renewal - b.days_to_renewal); break;
    case 'name': sorted.sort((a, b) => a.name.localeCompare(b.name)); break;
    default: sorted.sort((a, b) => b.combined_risk - a.combined_risk);
  }
  return sorted;
}

async function renderEventMix(account, container) {
  container.innerHTML = '<span class="spark-label">loading events…</span>';
  const res = await listRecentEvents({ account_id: account.id, ...clientOpts() });
  if (!res.ok) {
    container.innerHTML = `<span class="spark-label">${escapeHtml(res.message)}</span>`;
    return;
  }
  const counts = res.data.event_counts;
  const types = Object.keys(counts);
  if (types.length === 0) {
    container.innerHTML = '<span class="spark-label">no recent events</span>';
    return;
  }
  container.innerHTML = types
    .sort((a, b) => counts[b] - counts[a])
    .map((t) => `<span class="event-badge ${POSITIVE_EVENT_TYPES.has(t) ? 'positive' : ''}">${escapeHtml(t)} × ${counts[t]}</span>`)
    .join('');
}

function cardHtml(account) {
  const renewalLabel = account.days_to_renewal < 0
    ? `renewed ${Math.abs(account.days_to_renewal)}d ago`
    : `renews in ${account.days_to_renewal}d`;
  const flag = account.usage_insufficient_signal ? '<span class="flag">insufficient usage history</span>' : '';
  return `
    <div class="card" data-account-id="${escapeHtml(account.id)}">
      <div class="card-top">
        <span class="name">${escapeHtml(account.name)} <span class="card-meta">${escapeHtml(account.plan)}</span></span>
        <span class="card-meta">$${account.mrr.toLocaleString()} MRR · ${renewalLabel}</span>
      </div>
      <div class="card-reason">${escapeHtml(account.reason)}${flag}</div>
      <div class="card-detail">
        <div class="spark-row">
          <div class="spark-svg"></div>
          <span class="spark-label">weekly active users</span>
        </div>
        <div class="event-mix"><span class="spark-label">loading events…</span></div>
      </div>
    </div>`;
}

function attachCardHandlers(container, accountsById) {
  container.querySelectorAll('.card').forEach((card) => {
    const top = card.querySelector('.card-top');
    top.addEventListener('click', async () => {
      const wasExpanded = card.classList.contains('expanded');
      card.classList.toggle('expanded');
      if (wasExpanded) return;
      const account = accountsById.get(card.dataset.accountId);
      const sparkSlot = card.querySelector('.spark-svg');
      sparkSlot.innerHTML = sparklineSvg(account.__series);
      const eventSlot = card.querySelector('.event-mix');
      renderEventMix(account, eventSlot);
    });
  });
}

function renderBuckets(accounts) {
  const accountsById = new Map(accounts.map((a) => [a.id, a]));
  const buckets = [
    { key: 'urgent', label: 'Urgent' },
    { key: 'watch', label: 'Watch' },
    { key: 'healthy', label: 'Healthy' },
  ];
  mainEl.innerHTML = buckets.map(({ key, label }) => {
    const list = sortAccounts(accounts.filter((a) => a.bucket === key && passesFilters(a)));
    const body = list.length
      ? list.map(cardHtml).join('')
      : '<div class="empty-state">No accounts in this bucket right now.</div>';
    return `
      <section class="bucket bucket-${key}">
        <div class="bucket-header">
          <h2>${label}</h2>
          <span class="count-badge">${list.length}</span>
        </div>
        ${body}
      </section>`;
  }).join('');
  buckets.forEach(({ key }) => {
    const section = mainEl.querySelector(`.bucket-${key}`);
    attachCardHandlers(section, accountsById);
  });
}

let lastLoadedAt = null;

async function loadAndRender() {
  statusLine.textContent = 'checking connection…';
  errorSlot.innerHTML = '';
  // Confirm the backend is reachable and authenticated before firing tools
  // (proposal §03). The key is injected server-side, so this also verifies the
  // proxy/MCP server actually holds a working credential.
  const health = await checkHealth(clientOpts());
  if (!health.ok) {
    errorSlot.innerHTML = `<div class="error-banner">${escapeHtml(health.message)}</div>`;
    statusLine.textContent = 'connection failed';
    mainEl.innerHTML = '<div class="empty-state">Backend health check failed. Confirm the API base and that the server-side key is configured, then reload.</div>';
    return;
  }
  statusLine.textContent = 'loading…';
  const res = await listAtRiskAccounts(clientOpts());
  if (!res.ok) {
    errorSlot.innerHTML = `<div class="error-banner">${escapeHtml(res.message)}</div>`;
    statusLine.textContent = 'load failed';
    mainEl.innerHTML = '<div class="empty-state">Could not load accounts. Check API base/key above and reload.</div>';
    return;
  }

  // get_account_usage isn't re-fetched here — list_at_risk_accounts already
  // walked /accounts/{id}/usage to compute risk; the sparkline reuses that
  // series so opening a card is instant.
  const withSeries = await Promise.all(res.data.map(async (account) => {
    const usageRes = await getAccountUsage({ account_id: account.id, ...clientOpts() });
    return { ...account, __series: usageRes.ok ? usageRes.data.series : [] };
  }));

  renderBuckets(withSeries);
  lastLoadedAt = new Date();
  statusLine.textContent = `loaded ${withSeries.length} accounts at ${lastLoadedAt.toLocaleTimeString()}`;
}

[planFilter, windowFilter, sortBy].forEach((el) => el.addEventListener('change', () => {
  saveSettings();
  loadAndRender();
}));
baseInput.addEventListener('change', saveSettings);
reloadBtn.addEventListener('click', () => { saveSettings(); loadAndRender(); });

loadSettings();
loadAndRender();
</script>
</body>
</html>
